<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metronome — AI connection preview</title>
<style>body{margin:0;background:#e9efeb;color:#16333a;font:16px Arial,sans-serif}nav{display:flex;gap:12px;align-items:center;padding:14px 20px}button,input{font:inherit;padding:8px 12px}#stage{position:relative;width:100%;height:calc(100vw * .5625);overflow:hidden}iframe{border:0;width:1920px;height:1080px;transform-origin:top left}output{min-width:5em}</style>
<nav><button data-at="78.35">Before</button><button data-at="79.25">AI tools</button><button data-at="79.9">Connecting</button><button data-at="81">Connected</button><button id="play">Replay</button><label>Time <input id="time" type="number" min="72" max="84.99" step="0.05" value="81"></label><output id="stamp">81.00 s</output></nav>
<div id="stage"><iframe title="Metronome film" src="index.html"></iframe></div>
<script>const film=document.querySelector('iframe'),field=document.querySelector('#time'),stamp=document.querySelector('#stamp');let playing=false,raf;function fit(){film.style.transform=`scale(${innerWidth/1920})`}addEventListener('resize',fit);fit();function seek(t){film.contentWindow.Film.draw(t);field.value=t.toFixed(2);stamp.textContent=t.toFixed(2)+' s'}film.onload=()=>seek(81);document.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>{playing=false;cancelAnimationFrame(raf);seek(+b.dataset.at)});field.oninput=()=>{playing=false;cancelAnimationFrame(raf);seek(+field.value)};document.querySelector('#play').onclick=()=>{playing=true;const start=performance.now();function tick(now){const t=78.2+(now-start)/1000;if(t>=84.95){playing=false;seek(84.95);return}seek(t);raf=requestAnimationFrame(tick)}raf=requestAnimationFrame(tick)};</script>
