<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Metronome — Opening and testing labels</title><style>body{margin:0;background:#e9efeb;color:#173239;font:16px Arial}nav{display:flex;gap:10px;padding:12px;align-items:center}button,input{font:inherit;padding:8px}#stage{position:relative;width:100%;height:calc(100vh - 68px);overflow:hidden}iframe{position:absolute;left:50%;border:0;width:1920px;height:1080px;transform-origin:top left}</style><nav><button data-at="10">Downloads</button><button data-at="16">Transform</button><button data-at="19.7">Load</button><button data-at="30">Meet Metronome</button><button data-at="55">Agents</button><button data-at="68">Findings</button><label>Time <input type="number" id="time" value="19.7" step=".1"></label></nav><div id="stage"><iframe title="Metronome film" src="index.html"></iframe></div><script>const film=document.querySelector('iframe'),input=document.querySelector('#time');function fit(){film.style.transform=`translateX(-50%) scale(${Math.min(innerWidth/1920,(innerHeight-68)/1080)})`;film.style.transformOrigin="top center"}addEventListener('resize',fit);fit();function seek(t){film.contentWindow.Film.draw(t);input.value=t}film.onload=()=>seek(19.7);document.querySelectorAll('[data-at]').forEach(b=>b.onclick=()=>seek(+b.dataset.at));input.oninput=()=>seek(+input.value);</script>
