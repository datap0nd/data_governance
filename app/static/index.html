<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metronome</title>
    <link rel="stylesheet" href="/static/style.css?v=44">
</head>
<body>
    <a href="#app" class="skip-link">Skip to main content</a>
    <nav role="navigation" aria-label="Main navigation">
        <span class="logo" aria-label="Metronome">
            <span class="logo-word">Metronome</span>
            <svg class="logo-metronome" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                <path class="logo-metronome-body" d="M7.5 21h9L14.6 4.5H9.4L7.5 21Z"></path>
                <path class="logo-metronome-arm" d="M12 6.2l3.2 10.2"></path>
                <circle class="logo-metronome-weight" cx="14" cy="12.4" r="1.7"></circle>
                <path class="logo-metronome-base" d="M6 21h12"></path>
            </svg>
        </span>
        <div class="nav-primary" aria-label="Workspaces">
            <a href="#dashboard" data-page="dashboard" data-workspace="work" class="active"><span class="nav-health-dot" id="nav-health-dot"></span>Work</a>
            <a href="#reports" data-page="reports" data-workspace="catalog">Catalog</a>
            <a href="#lineage" data-page="lineage" data-workspace="lineage">Lineage</a>
            <a href="#scanner" data-page="scanner" data-workspace="operations">Operations</a>
        </div>
        <div class="nav-utilities">
            <button type="button" class="nav-utility-btn" id="btn-global-search" aria-haspopup="dialog" aria-controls="global-search-dialog">Search <kbd>/</kbd></button>
            <a href="#faq" data-page="faq" class="nav-utility-link">Help</a>
            <details class="nav-settings" id="nav-settings">
                <summary>Settings</summary>
                <div class="nav-settings-menu" role="menu">
                    <a href="#create" data-page="create" role="menuitem">People and manual assets</a>
                    <a href="#email" data-page="email" role="menuitem">Notifications</a>
                    <a href="#premiumviewers" data-page="premiumviewers" role="menuitem" id="nav-premium-viewers">Impact weighting</a>
                    <a href="#eventlog" data-page="eventlog" role="menuitem">Audit log</a>
                    <a href="#export" data-page="export" role="menuitem">Export</a>
                    <a href="#dataimport" data-page="dataimport" role="menuitem">Legacy data loader</a>
                    <a href="#changelog" data-page="changelog" role="menuitem">About and changelog</a>
                    <button type="button" id="btn-update-app" role="menuitem">Update app</button>
                </div>
            </details>
        </div>
        <span id="app-version" class="app-version"></span>
        <span id="connected-user"></span>
        <button class="theme-toggle" id="theme-toggle" aria-label="Toggle dark mode" title="Toggle dark mode">&#9790;</button>
    </nav>
    <div aria-live="polite" aria-atomic="true" class="sr-only" id="page-announcer"></div>
    <main id="app" role="main" aria-label="Page content">
        <div class="loading">Loading...</div>
    </main>
    <dialog id="global-search-dialog" class="global-search-dialog" aria-labelledby="global-search-title">
        <div class="global-search-head">
            <div>
                <h2 id="global-search-title">Search the catalog</h2>
                <p>Find reports, sources, and pipelines.</p>
            </div>
            <button type="button" class="dialog-close" id="btn-close-global-search" aria-label="Close search">&times;</button>
        </div>
        <label class="sr-only" for="global-search-input">Search assets</label>
        <input id="global-search-input" class="global-search-input" type="search" placeholder="Search by name, owner, type, or path" autocomplete="off">
        <div id="global-search-results" class="global-search-results" aria-live="polite"></div>
    </dialog>
    <script src="/static/app.js?v=47"></script>
</body>
</html>
