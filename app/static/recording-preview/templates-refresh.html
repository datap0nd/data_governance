<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reusable recordings and view refresh preview</title><link rel="stylesheet" href="/static/style.css?v=60">
<style>
body{padding:24px}
.preview-bar{max-width:1180px;margin:0 auto 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 16px;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;font-size:.82rem}
.preview-bar h1{font-size:1.05rem;font-weight:700;margin:0 auto 0 0}
.preview-bar label{display:flex;align-items:center;gap:6px}
.preview-nav{max-width:1180px;margin:0 auto 16px;display:flex;gap:8px;flex-wrap:wrap}
.preview-nav button[aria-current=true]{outline:2px solid var(--accent);outline-offset:2px}
#preview-status{max-width:1180px;margin:8px auto;color:var(--accent);font-size:.85rem;min-height:1.2em}
#preview-status:empty{display:none}
#flow-workspace{max-width:1180px;margin:0 auto}
#preview-log{width:100%;border:1px solid var(--border);border-radius:8px;min-height:1200px;background:var(--bg)}
@media(max-width:600px){body{padding:12px}.preview-bar h1{width:100%}}
</style>
<div class="preview-bar"><h1>Fictional preview · reusable recordings and downstream view refresh</h1>
<label>Discovery result <select id="preview-discovery" aria-label="Fictional discovery result"><option value="ok">Three views found</option><option value="empty">Verified empty</option><option value="missing">Table missing from metadata</option><option value="incomplete">Incomplete lineage</option><option value="stale">Stale metadata</option><option value="cyclic">Dependency cycle</option></select></label>
<label>Retry outcome <select id="preview-retry" aria-label="Fictional retry outcome"><option value="success">Remaining views succeed</option><option value="fail">A view fails again</option></select></label>
<label>Send again outcome <select id="preview-email" aria-label="Fictional Send again outcome"><option value="submitted">Outlook submits the email</option><option value="fail">Outlook hand-off fails</option></select></label>
<button id="preview-reset" class="btn-secondary">Reset preview</button></div>
<nav class="preview-nav" aria-label="Preview screens"><button class="btn-secondary" data-screen="builder" aria-current="true">Edit Flow</button><button class="btn-secondary" data-screen="recording">Recording</button><button class="btn-secondary" data-screen="new">New flow (replicate)</button><button class="btn-secondary" data-screen="runs">Run history</button><button class="btn-secondary" data-screen="log">Run log</button></nav>
<div id="preview-status" role="status"></div>
<main id="flow-workspace"></main>
<iframe id="preview-log" title="Run log preview" src="templates-refresh-run-log.html" hidden></iframe>
<script src="/static/flow_recording_model.js?v=7"></script>
<script type="module" src="templates-refresh.js"></script></html>
