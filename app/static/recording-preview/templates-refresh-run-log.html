<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Run log preview</title>
    <link rel="stylesheet" href="/static/style.css?v=60">
</head>
<body class="flow-log-body">
    <main class="flow-log-page" id="flow-run-log" aria-live="polite"><div class="loading">Loading fictional run…</div></main>
    <script>
    // The production run-log page reads the run ID from the URL and fetches it.
    // The preview answers both from fictional data owned by the parent page.
    window.previewRuns = {};
    window.fetch = async (url, options) => {
        const match = String(url).match(/\/api\/flows\/runs\/(\d+)(\/retry-views|\/resend-email)?$/);
        const run = match && window.previewRuns[match[1]];
        if (match && match[2] === '/resend-email' && run) {
            if (window.parent.document.getElementById('preview-email')?.value === 'fail') {
                return { ok: false, status: 502, json: async () => ({ detail: 'Email could not be handed to Outlook: Failed to launch Outlook email task: Access is denied.' }) };
            }
            run.email = { ...run.email, status: 'pending', detail: null };
            window.parent.postMessage({ type: 'resend-email', runId: Number(match[1]) }, '*');
            return { ok: true, json: async () => ({ run_id: Number(match[1]), status: 'pending' }) };
        }
        if (match && match[2] && run) { window.parent.postMessage({ type: 'retry-views', runId: Number(match[1]) }, '*'); return { ok: true, json: async () => ({ id: 44 }) }; }
        if (run) return { ok: true, json: async () => run };
        return { ok: false, status: 404, json: async () => ({ detail: 'Preview only.' }) };
    };
    window.addEventListener('message', event => {
        if (event.data?.type !== 'show-run') return;
        window.previewRuns = event.data.runs;
        render(window.previewRuns[event.data.runId]);
        const retry = document.getElementById('flow-retry-views');
        if (retry) retry.onclick = () => { window.parent.postMessage({ type: 'retry-views', runId: event.data.runId }, '*'); };
    });
    </script>
    <script src="/static/flow_run_log.js?v=6"></script>
</body>
</html>
