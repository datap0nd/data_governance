<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flow folder naming review</title><link rel="stylesheet" href="/static/style.css">
<style>body{padding:24px}header,aside,#preview-status{max-width:820px;margin:0 auto 20px}header{display:flex;gap:16px;align-items:center;flex-wrap:wrap}header h1{margin-right:auto}aside{padding:16px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}pre{white-space:pre-wrap;overflow-wrap:anywhere}#preview-status{color:var(--accent)}select{font:inherit;padding:6px}@media(max-width:600px){body{padding:12px}}</style>
