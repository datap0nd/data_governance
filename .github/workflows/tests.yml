name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies
        run: >
          pip install pytest fastapi uvicorn pydantic httpx playwright
          openpyxl==3.1.5 xlrd==2.0.2 pyxlsb==1.0.10
          python-multipart apscheduler pandas sqlalchemy truststore
      - name: Run Python test suite
        run: python -m pytest tests -q
      - name: Run catalog tree tests
        run: node tests/test_flow_catalog_tree.mjs
