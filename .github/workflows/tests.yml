name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.classify.outputs.application }}
      postgres: ${{ steps.classify.outputs.postgres }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          application=true
          postgres=false
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            application=false
            while IFS= read -r path; do
              case "$path" in
                docs/*|AGENTS.md|CLAUDE.md|README.md|.github/PULL_REQUEST_TEMPLATE.md) ;;
                *) application=true ;;
              esac
              case "$path" in
                app/flow_sql.py|requirements-ci.*|tests/test_sql_ownership_postgres.py|.github/workflows/tests.yml)
                  postgres=true ;;
              esac
            done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          fi
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            postgres=true
          fi
          if [[ "${{ github.event_name }}" == "push" ]]; then
            postgres=true
          fi
          echo "application=$application" >> "$GITHUB_OUTPUT"
          echo "postgres=$postgres" >> "$GITHUB_OUTPUT"
          echo "Application regression required: $application"
          echo "PostgreSQL integration required: $postgres"

  python:
    name: Python (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.application == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || github.event_name == 'push' && '["windows-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install locked test dependencies
        run: pip install -r requirements-ci.lock
      - name: Install browsers for synthetic UI fixtures
        run: python -m playwright install --with-deps chromium chrome
      - name: Run Python test suite
        env:
          DG_DB_PATH: ${{ runner.temp }}/metronome-${{ matrix.os }}/governance.db
          DG_TEST_RUN_ROOT: ${{ runner.temp }}/metronome-${{ matrix.os }}
          DG_BROWSER_PROFILE_ROOT: ${{ runner.temp }}/metronome-${{ matrix.os }}/browser-profiles
        run: python -m pytest tests -q --durations=20 --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-${{ matrix.os }}-results
          path: test-results.xml
          retention-days: 14

  frontend:
    name: Frontend contracts and syntax
    needs: scope
    if: needs.scope.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run frontend contracts
        shell: bash
        run: |
          set -euo pipefail
          for test_file in tests/test_*.mjs; do node "$test_file"; done
      - name: Check frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          for source_file in app/static/*.js; do node --check "$source_file"; done

  postgres:
    name: PostgreSQL ${{ matrix.postgres }}
    needs: scope
    if: needs.scope.outputs.postgres == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: metronome_test_ownership
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d metronome_test_ownership"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - name: Install locked test dependencies
        run: pip install -r requirements-ci.lock
      - name: Test SQL ownership on disposable PostgreSQL
        env:
          METRONOME_TEST_POSTGRES_DSN: postgresql+psycopg2://postgres@127.0.0.1:5432/metronome_test_ownership
        run: python -m pytest tests/test_sql_ownership_postgres.py -q -ra

  merge-ready:
    name: Merge ready
    if: always()
    needs: [scope, python, frontend, postgres]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected check
        env:
          CI_NEEDS_JSON: ${{ toJSON(needs) }}
        run: python tools/ci/merge_gate.py --needs-json "$CI_NEEDS_JSON"
