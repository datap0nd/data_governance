name: Tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # A newer PR commit or main merge contains the older revision's content, so
  # only the newest run is useful. Keep scheduled/manual runs independent.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  scope:
    name: Change scope
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.classify.outputs.application }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        shell: bash
        run: |
          application=true
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            application=false
            while IFS= read -r path; do
              case "$path" in
                docs/*|AGENTS.md|CLAUDE.md|.github/PULL_REQUEST_TEMPLATE.md|.github/workflows/*) ;;
                *) application=true; break ;;
              esac
            done < <(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")
            git diff --check "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"
          fi
          echo "application=$application" >> "$GITHUB_OUTPUT"
          echo "Application regression required: $application"

  python:
    name: Python (${{ matrix.os }})
    needs: scope
    if: needs.scope.outputs.application == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-latest"]' || github.event_name == 'push' && '["windows-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install test dependencies
        run: pip install -r requirements-ci.txt
      - name: Install browsers for synthetic UI fixtures
        run: python -m playwright install --with-deps chromium chrome
      - name: Run Python test suite
        run: python -m pytest tests -q --durations=20

  frontend:
    name: Frontend contracts and syntax
    needs: scope
    if: needs.scope.outputs.application == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Run catalog tree tests
        run: node tests/test_flow_catalog_tree.mjs
      - name: Run Flow list display tests
        run: node tests/test_flows_display.mjs
      - name: Run Flow activity polling tests
        run: node tests/test_flow_activity_polling.mjs
      - name: Run lineage display tests
        run: node tests/test_lineage_display.mjs
      - name: Run lineage edge tests
        run: node tests/test_lineage_edges.mjs
      - name: Run lineage layer tests
        run: node tests/test_lineage_layers.mjs
      - name: Run scan status display tests
        run: node tests/test_scan_status_display.mjs
      - name: Run scanner job display tests
        run: node tests/test_scanner_job_display.mjs
      - name: Run Flow diagnostics display tests
        run: node tests/test_flow_diagnostics_display.mjs
      - name: Run AI Operations Investigator display tests
        run: node tests/test_ai_operations_display.mjs
      - name: Run AI settings display tests
        run: node tests/test_ai_settings_display.mjs
      - name: Run Updates display tests
        run: node tests/test_updates_display.mjs
      - name: Run Paths display tests
        run: node tests/test_paths_display.mjs
      - name: Run Flow destination display tests
        run: node tests/test_flow_destination_display.mjs
      - name: Run grouped Flow list tests
        run: node tests/test_flow_groups.mjs
      - name: Run Flow sorting tests
        run: node tests/test_flow_sorting.mjs
      - name: Run Flow builder contract tests
        run: node tests/test_flow_builder_contract.mjs
      - name: Run Flow capacity display tests
        run: node tests/test_flow_capacity_display.mjs
      - name: Run parallel download display tests
        run: node tests/test_flow_parallel_display.mjs
      - name: Run pipeline insights display tests
        run: node tests/test_pipeline_insights_display.mjs
      - name: Run scanner modules display tests
        run: node tests/test_scanner_modules_display.mjs
      - name: Check frontend JavaScript syntax
        run: node --check app/static/app.js
      - name: Check Users JavaScript syntax
        run: node --check app/static/users.js
      - name: Check run log JavaScript syntax
        run: node --check app/static/flow_run_log.js
      - name: Check recording editor syntax
        run: node --check app/static/flow_recordings.js
      - name: Test visual recording model
        run: node tests/test_recording_visual_model.mjs
      - name: Check visual recording editor syntax
        run: node --check app/static/flow_recording_editor.js
      - name: Check visual recording model syntax
        run: node --check app/static/flow_recording_model.js
